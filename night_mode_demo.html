<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Mode Chat Background — Demo</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .demo-controls {
            width: 100%;
            max-width: 460px;
            background: rgba(24, 26, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-row label {
            font-size: 13px;
            font-weight: 600;
            color: #A0A5B5;
        }

        .speed-buttons {
            display: flex;
            gap: 8px;
        }

        .speed-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #E8E9ED;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .speed-btn.active {
            background: #6C5CE7;
            border-color: #6C5CE7;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.4);
        }

        .chat-app-wrapper {
            width: 100%;
            max-width: 460px;
            height: 520px;
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div class="demo-controls">
        <div class="control-row">
            <label>Sky Cycle Speed (QA Test Mode):</label>
            <div class="speed-buttons">
                <button class="speed-btn" onclick="setSpeed(1, this)">Real Time (35m)</button>
                <button class="speed-btn active" onclick="setSpeed(60, this)">60x (30s Rise / 5s Fall)</button>
                <button class="speed-btn" onclick="setSpeed(180, this)">180x (10s Rise / 1.7s Fall)</button>
            </div>
        </div>
        <div class="control-row">
            <label>Reduced Motion:</label>
            <button id="reducedBtn" class="speed-btn" onclick="toggleReducedMotion()">Off</button>
        </div>
    </div>

    <div class="chat-app-wrapper" id="react-root"></div>

    <!--
        Self-contained preview of the NightModeChatBackground component.
        The canonical source lives in 5 modular files (Star.jsx, Cloud.jsx,
        Moon.jsx, ChatUI.jsx, NightModeChatBackground.jsx) for use with a
        bundler; this inline copy keeps the browser demo dependency-free.
    -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

        const KEYFRAMES = `
@keyframes twinkle {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 1; }
}
@keyframes drift {
  0% { transform: translateX(0); }
  100% { transform: translateX(14px); }
}
@keyframes shoot {
  0% { transform: translate(0, 0); opacity: 0; }
  5% { opacity: 1; }
  20% { transform: translate(-160px, 90px); opacity: 0; }
  100% { opacity: 0; }
}
@keyframes cloudDrift {
  0% { transform: translateX(0); }
  100% { transform: translateX(60px); }
}
.chat-input::placeholder { color: #5C6270; }
`;

        function Star({ left, top, size, twinkleDuration, twinkleDelay, driftDuration, animate = true }) {
            const starStyle = {
                position: 'absolute',
                width: size,
                height: size,
                borderRadius: '50%',
                background: '#AEDFFF'
            };
            if (animate) {
                starStyle.animation = `twinkle ${twinkleDuration}s ease-in-out ${twinkleDelay}s infinite`;
            }
            return (
                <div style={{
                    position: 'absolute',
                    left: `${left}%`,
                    top: `${top}%`,
                    ...(animate && { animation: `drift ${driftDuration}s ease-in-out infinite alternate` })
                }}>
                    <div style={starStyle} />
                </div>
            );
        }

        const PUFF_STYLES = {
            puff1: {
                width: 40, height: 22, borderRadius: '50%',
                background: 'linear-gradient(#F3F5F8, #C7CDD6)',
                boxShadow: '0 3px 6px rgba(0,0,0,0.25)'
            },
            puff2: {
                width: 32, height: 26, borderRadius: '50%',
                background: 'linear-gradient(#FBFCFE, #D2D8E0)',
                boxShadow: '0 2px 5px rgba(0,0,0,0.22)'
            },
            puff3: {
                width: 30, height: 24, borderRadius: '50%',
                background: 'linear-gradient(#F8FAFC, #C7CDD6)',
                boxShadow: '0 2px 5px rgba(0,0,0,0.22)'
            }
        };

        function Cloud({ top, left, scale, driftDuration, animate = true }) {
            return (
                <div style={{ position: 'absolute', top, left, transform: `scale(${scale})`, transformOrigin: 'top left' }}>
                    <div style={{
                        position: 'relative',
                        ...(animate && { animation: `cloudDrift ${driftDuration}s ease-in-out infinite alternate` })
                    }}>
                        <div style={{ position: 'absolute', left: 0, bottom: 0, ...PUFF_STYLES.puff2 }} />
                        <div style={{ position: 'absolute', right: 0, bottom: 0, ...PUFF_STYLES.puff3 }} />
                        <div style={{ position: 'absolute', left: 11, bottom: 0, ...PUFF_STYLES.puff1 }} />
                    </div>
                </div>
            );
        }

        const MOON_ANCHOR = { left: '65%', transform: 'translateX(-50%)', zIndex: 2 };

        const MOON_STYLE = {
            position: 'absolute',
            ...MOON_ANCHOR,
            width: 56,
            height: 56,
            borderRadius: '48% 52% 47% 53%',
            background: 'radial-gradient(circle at 38% 34%, #FFFFFF 0%, #FFFDFD 20%, #FBE9EC 42%, #F0CFD5 68%, #DBA2AC 88%, #B37784 100%)',
            boxShadow: 'inset -10px -8px 16px rgba(90,45,55,0.42), inset 4px 4px 10px rgba(255,255,255,0.6), 0 0 26px rgba(247,222,225,0.4)',
            overflow: 'hidden'
        };

        const GLOW_STYLE = {
            position: 'absolute',
            ...MOON_ANCHOR,
            width: 140,
            height: 140,
            borderRadius: '50%',
            background: 'radial-gradient(circle, rgba(247,222,225,0.3) 0%, rgba(255,255,255,0.12) 42%, rgba(247,222,225,0) 72%)'
        };

        const CRATERS = [
            { width: 12, height: 12, top: 12, left: 13, background: 'rgba(150,105,115,0.3)', boxShadow: 'inset 1px 1px 2px rgba(255,255,255,0.45), inset -2px -2px 4px rgba(90,45,55,0.32)' },
            { width: 7, height: 7, top: 27, left: 30, background: 'rgba(150,105,115,0.26)', boxShadow: 'inset 1px 1px 1px rgba(255,255,255,0.4), inset -1px -1px 2px rgba(90,45,55,0.26)' },
            { width: 5, height: 5, top: 36, left: 12, background: 'rgba(150,105,115,0.24)', boxShadow: 'inset 1px 1px 1px rgba(255,255,255,0.35), inset -1px -1px 2px rgba(90,45,55,0.22)' },
            { width: 4, height: 4, top: 20, left: 38, background: 'rgba(150,105,115,0.22)', boxShadow: 'inset 1px 1px 1px rgba(255,255,255,0.3), inset -1px -1px 1px rgba(90,45,55,0.2)' }
        ];

        function Moon({ bottom, glowBottom }) {
            return (
                <>
                    <div style={{ ...GLOW_STYLE, bottom: glowBottom }} />
                    <div style={{ ...MOON_STYLE, bottom }}>
                        {CRATERS.map((c, i) => (
                            <div key={i} style={{ position: 'absolute', borderRadius: '50%', ...c }} />
                        ))}
                    </div>
                </>
            );
        }

        const INITIAL_MESSAGES = [
            { id: 1, sender: 'them', text: 'Hey there! How is the night sky looking over your city?', time: '11:42 PM' },
            { id: 2, sender: 'me', text: 'It looks absolutely stunning! The moon and stars are twinkling brightly.', time: '11:43 PM' },
            { id: 3, sender: 'them', text: 'That sounds magical! Enjoy the peaceful night view.', time: '11:44 PM' }
        ];

        function ChatUI() {
            const [messages, setMessages] = useState(INITIAL_MESSAGES);
            const [inputMsg, setInputMsg] = useState('');

            const handleSend = (e) => {
                e.preventDefault();
                const text = inputMsg.trim();
                if (!text) return;
                setMessages((prev) => [
                    ...prev,
                    {
                        id: Date.now(),
                        sender: 'me',
                        text,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }
                ]);
                setInputMsg('');
            };

            return (
                <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 5 }}>
                    <div style={{
                        position: 'absolute', top: 0, left: 0, right: 0,
                        display: 'flex', alignItems: 'center', gap: 10,
                        padding: '14px 16px',
                        background: 'rgba(24,26,32,0.55)',
                        backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)',
                        borderBottom: '0.5px solid rgba(255,255,255,0.08)'
                    }}>
                        <div style={{
                            width: 36, height: 36, borderRadius: '50%',
                            background: '#6C5CE7', color: '#EEEDFE',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            fontWeight: 600, fontSize: 13, flexShrink: 0
                        }}>LS</div>
                        <div>
                            <div style={{ fontSize: 14, fontWeight: 500, color: '#E8E9ED', lineHeight: 1.2 }}>Luna Sky</div>
                            <div style={{
                                display: 'flex', alignItems: 'center', gap: 5, marginTop: 2,
                                fontSize: 12, color: '#4ADE80'
                            }}>
                                <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#4ADE80', flexShrink: 0 }} />
                                Online
                            </div>
                        </div>
                    </div>

                    <div style={{
                        position: 'absolute', top: 65, left: 0, right: 0, bottom: 55,
                        overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 10,
                        padding: '16px'
                    }}>
                        {messages.map((m) => (
                            <div key={m.id} style={{ display: 'flex', justifyContent: m.sender === 'me' ? 'flex-end' : 'flex-start' }}>
                                <div style={{
                                    maxWidth: '75%', padding: '10px 14px', fontSize: 14, lineHeight: 1.45,
                                    ...(m.sender === 'me'
                                        ? { background: '#6C5CE7', color: '#F4F3FF', borderRadius: '14px 14px 4px 14px' }
                                        : { background: 'rgba(30,33,40,0.85)', color: '#E8E9ED', borderRadius: '14px 14px 14px 4px' })
                                }}>
                                    <div>{m.text}</div>
                                    <div style={{
                                        marginTop: 3, fontSize: 11, color: '#9BA1AC',
                                        textAlign: m.sender === 'me' ? 'right' : 'left'
                                    }}>{m.time}</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <form onSubmit={handleSend} style={{
                        position: 'absolute', bottom: 0, left: 0, right: 0,
                        display: 'flex', alignItems: 'center', gap: 10,
                        padding: '10px 16px',
                        background: 'rgba(24,26,32,0.6)',
                        backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)',
                        borderTop: '0.5px solid rgba(255,255,255,0.08)'
                    }}>
                        <input
                            type="text"
                            value={inputMsg}
                            onChange={(e) => setInputMsg(e.target.value)}
                            placeholder="Type a message..."
                            className="chat-input"
                            style={{
                                flex: 1,
                                background: 'rgba(30,33,40,0.7)',
                                border: 'none', outline: 'none',
                                borderRadius: 20, padding: '9px 16px',
                                fontSize: 14, color: '#E8E9ED'
                            }}
                        />
                        <button type="submit" title="Send message" style={{
                            width: 34, height: 34, borderRadius: '50%',
                            background: '#6C5CE7', color: '#F4F3FF',
                            border: 'none', cursor: 'pointer',
                            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0
                        }}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12" />
                                <polyline points="12 5 19 12 12 19" />
                            </svg>
                        </button>
                    </form>
                </div>
            );
        }

        const CLOUD_SPECS = [
            { id: 'a', top: '20%', left: '6%', scale: 1.1, driftDuration: 34 },
            { id: 'b', top: '30%', left: '55%', scale: 0.85, driftDuration: 28 },
            { id: 'c', top: '14%', left: '72%', scale: 0.95, driftDuration: 30 }
        ];

        const REDUCED_MOTION_STAGE = {
            moonBottom: 220, glowBottom: 196,
            dawnOpacity: 0, dayOpacity: 0, starOpacity: 1, hazeOpacity: 1
        };

        function NightModeChatBackground({
            riseDurationMs = 1800000,
            descendMs = 300000,
            speedMultiplier = 1,
            reducedMotion = null
        }) {
            const [isReducedMotion] = useState(() => {
                if (reducedMotion === true) return true;
                if (reducedMotion === false) return false;
                return typeof window !== 'undefined' && !!window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            });

            const backStars = useMemo(() => {
                const r = (min, max) => Math.random() * (max - min) + min;
                return Array.from({ length: 35 }, (_, id) => ({
                    id,
                    left: r(0, 95), top: r(0, 55),
                    size: r(0.5, 1.2),
                    twinkleDuration: r(2, 5), twinkleDelay: r(0, 3),
                    driftDuration: r(20, 30)
                }));
            }, []);

            const frontStars = useMemo(() => {
                const r = (min, max) => Math.random() * (max - min) + min;
                return Array.from({ length: 20 }, (_, id) => ({
                    id,
                    left: r(0, 95), top: r(0, 55),
                    size: r(1.2, 2.2),
                    twinkleDuration: r(2, 5), twinkleDelay: r(0, 3),
                    driftDuration: r(12, 22)
                }));
            }, []);

            const [stage, setStage] = useState(
                isReducedMotion ? REDUCED_MOTION_STAGE
                    : { moonBottom: -56, glowBottom: -80, dawnOpacity: 0, dayOpacity: 0, starOpacity: 1, hazeOpacity: 1 }
            );
            const [shootingStars, setShootingStars] = useState([]);

            useEffect(() => {
                if (isReducedMotion) {
                    setStage(REDUCED_MOTION_STAGE);
                    return;
                }

                const effectiveRise = riseDurationMs / speedMultiplier;
                const effectiveDescend = descendMs / speedMultiplier;
                const totalMs = effectiveRise + effectiveDescend;

                let rafId = null;
                let startTime = performance.now();
                let hiddenElapsed = 0;

                const tick = () => {
                    const elapsed = performance.now() - startTime;
                    const cycle = elapsed % totalMs;

                    let h;
                    if (cycle <= effectiveRise) {
                        h = ease(cycle / effectiveRise);
                    } else {
                        h = 1 - ease((cycle - effectiveRise) / effectiveDescend);
                    }

                    const moonBottom = -56 + h * 300;
                    const glowBottom = -80 + h * 300;

                    let dawnOpacity = 0, dayOpacity = 0, starOpacity = 1, hazeOpacity = 1;

                    if (h >= 0.7 && h <= 0.9) {
                        const dt = (h - 0.7) / 0.2;
                        dawnOpacity = dt;
                        starOpacity = Math.max(0, 1 - dt * 1.5);
                        hazeOpacity = Math.max(0, 1 - dt * 1.5);
                    } else if (h > 0.9) {
                        const dt = (h - 0.9) / 0.1;
                        dawnOpacity = Math.max(0, 1 - dt);
                        dayOpacity = dt;
                        starOpacity = 0;
                        hazeOpacity = 0;
                    }

                    setStage({ moonBottom, glowBottom, dawnOpacity, dayOpacity, starOpacity, hazeOpacity });
                    rafId = requestAnimationFrame(tick);
                };

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'hidden') {
                        cancelAnimationFrame(rafId);
                        hiddenElapsed = performance.now() - startTime;
                    } else {
                        startTime = performance.now() - hiddenElapsed;
                        rafId = requestAnimationFrame(tick);
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                rafId = requestAnimationFrame(tick);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    cancelAnimationFrame(rafId);
                };
            }, [isReducedMotion, riseDurationMs, descendMs, speedMultiplier]);

            useEffect(() => {
                if (isReducedMotion) return;

                const r = (min, max) => Math.random() * (max - min) + min;
                let timer = null;
                const schedule = () => {
                    timer = setTimeout(() => {
                        const id = `${Date.now()}-${Math.random()}`;
                        setShootingStars((prev) => [
                            ...prev,
                            { id, top: r(5, 35), left: r(40, 80) }
                        ]);
                        setTimeout(() => {
                            setShootingStars((prev) => prev.filter((s) => s.id !== id));
                        }, 1800);
                        schedule();
                    }, r(15000, 35000));
                };

                schedule();
                return () => clearTimeout(timer);
            }, [isReducedMotion]);

            const animate = !isReducedMotion;

            return (
                <div style={{
                    position: 'relative', width: '100%', height: 520, minHeight: 400,
                    borderRadius: 16, overflow: 'hidden',
                    background: 'linear-gradient(#15171C 45%, #16202C 85%, #1B2838 100%)'
                }}>
                    <style>{KEYFRAMES}</style>

                    <div style={{
                        position: 'absolute', left: 0, right: 0, bottom: 0, height: 120, zIndex: 1,
                        background: 'linear-gradient(rgba(30,45,65,0) 0%, rgba(45,65,90,0.35) 100%)',
                        opacity: stage.hazeOpacity, pointerEvents: 'none'
                    }} />

                    <div style={{
                        position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 1,
                        background: '#F4B183', opacity: stage.dawnOpacity,
                        transition: 'opacity 8s ease', pointerEvents: 'none'
                    }} />

                    <div style={{
                        position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 1,
                        background: '#FFFFFF', opacity: stage.dayOpacity,
                        transition: 'opacity 8s ease', pointerEvents: 'none'
                    }} />

                    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 2, opacity: stage.starOpacity, pointerEvents: 'none' }}>
                        {backStars.map((s) => <Star key={`back-${s.id}`} {...s} animate={animate} />)}
                    </div>

                    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 2, opacity: stage.starOpacity, pointerEvents: 'none' }}>
                        {frontStars.map((s) => <Star key={`front-${s.id}`} {...s} animate={animate} />)}
                    </div>

                    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 2, pointerEvents: 'none' }}>
                        {shootingStars.map((s) => (
                            <div key={s.id} style={{
                                position: 'absolute', top: `${s.top}%`, left: `${s.left}%`,
                                width: 60, height: 2, borderRadius: 2,
                                background: 'linear-gradient(to left, rgba(255,255,255,0.9), rgba(255,255,255,0))',
                                animation: 'shoot 1.8s ease-out forwards'
                            }} />
                        ))}
                    </div>

                    <Moon bottom={stage.moonBottom} glowBottom={stage.glowBottom} />

                    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 3, pointerEvents: 'none' }}>
                        {CLOUD_SPECS.map((c) => <Cloud key={c.id} {...c} animate={animate} />)}
                    </div>

                    <ChatUI />
                </div>
            );
        }

        let currentSpeed = 60;
        let isReduced = false;
        const rootEl = document.getElementById('react-root');

        function renderApp() {
            ReactDOM.createRoot(rootEl).render(
                <NightModeChatBackground speedMultiplier={currentSpeed} reducedMotion={isReduced} />
            );
        }

        window.setSpeed = function (speed, btn) {
            currentSpeed = speed;
            document.querySelectorAll('.speed-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            renderApp();
        };

        window.toggleReducedMotion = function () {
            isReduced = !isReduced;
            document.getElementById('reducedBtn').innerText = isReduced ? 'On' : 'Off';
            renderApp();
        };

        renderApp();
    </script>
</body>
</html>
