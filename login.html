<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Login</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container {
            text-align: center;
        }
        form {
            text-align: left;
        }
        .app-logo {
            font-size: 38px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .app-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="app-logo">&#10024; ChatApp</div>
        <p class="app-subtitle">Sign in to continue</p>

        <form action="/loginpage" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="user_email" autocomplete="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="passowrd" autocomplete="current-password" placeholder="Enter your password" required>

            <button type="submit">Sign In</button>
        </form>

        <div class="error" id="errorMessage"></div>

        <div class="signup">
            Don't have an account?
            <a href="sign_up.html">Create one</a>
        </div>

        <div style="margin-top: 12px;">
            <a href="forgetpassword.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">Forgot password?</a>
        </div>
    </div>

    <script>
        const getBackendUrl = () => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                if (window.location.port !== '8080' && window.location.port !== '') {
                    return 'http://localhost:8080';
                }
                return '';
            }
            return 'https://chat-backend-i0ri.onrender.com';
        };

        // Check if user is already logged in
        fetch(getBackendUrl() + '/api/current-user', { credentials: 'include' })
            .then(res => {
                if (res.ok) return res.json();
                throw new Error('Not authenticated');
            })
            .then(userMap => {
                if (userMap.email) {
                    window.location.href = '/homepage.html';
                }
            })
            .catch(err => {
                console.log('Not logged in:', err.message);
            });

        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        const success = params.get("success");
        if (error) {
            document.getElementById("errorMessage").innerText = error;
            document.getElementById("errorMessage").style.display = 'block';
        }
        if (success) {
            document.getElementById("errorMessage").innerText = success;
            document.getElementById("errorMessage").style.color = 'var(--success)';
            document.getElementById("errorMessage").style.background = 'var(--success-light)';
            document.getElementById("errorMessage").style.display = 'block';
        }

        // Handle Login Form via fetch to prevent cross-origin redirect issues
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const errDiv = document.getElementById("errorMessage");
            errDiv.style.display = 'none';

            fetch(getBackendUrl() + '/loginpage', {
                method: 'POST',
                body: formData,
                credentials: 'include'
            })
            .then(res => {
                const targetUrl = res.url || '';
                // Check if backend redirected with an error query param
                if (targetUrl.includes('error=')) {
                    try {
                        const urlObj = new URL(targetUrl);
                        const errorMsg = urlObj.searchParams.get("error");
                        if (errorMsg) {
                            errDiv.innerText = decodeURIComponent(errorMsg);
                            errDiv.style.display = 'block';
                            return;
                        }
                    } catch (err) {}
                    errDiv.innerText = 'Invalid email or password';
                    errDiv.style.display = 'block';
                } else if (targetUrl.includes('/homepage.html') || res.ok) {
                    window.location.href = '/homepage.html';
                } else {
                    errDiv.innerText = 'Invalid email or password';
                    errDiv.style.display = 'block';
                }
            })
            .catch(err => {
                console.error('Login error:', err);
                errDiv.innerText = 'Unable to connect to server. Please try again.';
                errDiv.style.display = 'block';
            });
        });
    </script>
</body>

</html>
