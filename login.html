<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Login</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container {
            text-align: center;
        }
        form {
            text-align: left;
        }
        .app-logo {
            font-size: 38px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .app-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="app-logo">&#10024; ChatApp</div>
        <p class="app-subtitle">Sign in to continue</p>

        <form action="/loginpage" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="user_email" autocomplete="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="passowrd" autocomplete="current-password" placeholder="Enter your password" required>

            <button type="submit">Sign In</button>
        </form>

        <div class="error" id="errorMessage"></div>

        <div class="signup">
            Don't have an account?
            <a href="sign_up.html">Create one</a>
        </div>

        <div style="margin-top: 12px;">
            <a href="forgetpassword.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">Forgot password?</a>
        </div>
    </div>

    <script>
        function isTokenExpired(token) {
            if (!token) return true;
            try {
                const payloadBase64 = token.split('.')[1];
                if (!payloadBase64) return true;
                const base64 = payloadBase64.replace(/-/g, '+').replace(/_/g, '/');
                const decodedPayload = JSON.parse(atob(base64));
                if (!decodedPayload.exp) return false;
                const currentTime = Math.floor(Date.now() / 1000);
                return currentTime >= decodedPayload.exp;
            } catch (e) {
                return true;
            }
        }

        const getBackendUrl = () => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                if (window.location.port !== '8080' && window.location.port !== '') {
                    return 'http://localhost:8080';
                }
                return '';
            }
            return 'https://chat-backend-vjax.onrender.com';
        };

        // Check if user is already logged in via stored JWT token
        const savedToken = localStorage.getItem('jwtToken');
        if (savedToken) {
            if (isTokenExpired(savedToken)) {
                console.log('JWT Token is expired. Clearing token.');
                localStorage.removeItem('jwtToken');
            } else {
                console.log('Valid JWT Token found. Bypassing login page...');
                window.location.href = '/homepage.html';
            }
        }

        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        const success = params.get("success");
        if (error) {
            document.getElementById("errorMessage").innerText = error;
            document.getElementById("errorMessage").style.display = 'block';
        }
        if (success) {
            document.getElementById("errorMessage").innerText = success;
            document.getElementById("errorMessage").style.color = 'var(--success)';
            document.getElementById("errorMessage").style.background = 'var(--success-light)';
            document.getElementById("errorMessage").style.display = 'block';
        }

        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const errDiv = document.getElementById("errorMessage");
            errDiv.style.display = 'none';
            errDiv.innerText = '';

            let urlsToTry = ['/loginpage', 'https://chat-backend-vjax.onrender.com/loginpage'];
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                urlsToTry = ['http://localhost:8080/loginpage', '/loginpage'];
            }

            let lastErrorMessage = 'Unable to connect to server. Please try again.';
            for (let url of urlsToTry) {
                try {
                    let res = await fetch(url, {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });

                    const targetUrl = res.url || '';
                    if (targetUrl.includes('error=')) {
                        try {
                            const urlObj = new URL(targetUrl);
                            const errorMsg = urlObj.searchParams.get("error");
                            if (errorMsg) {
                                errDiv.innerText = decodeURIComponent(errorMsg);
                                errDiv.style.display = 'block';
                                return;
                            }
                        } catch (err) {}
                    }

                    const contentType = res.headers.get("content-type");
                    let data = null;
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        data = await res.json();
                    }

                    if (data && data.status === 'ERROR') {
                        errDiv.innerText = data.message || 'Invalid email or password';
                        errDiv.style.display = 'block';
                        return;
                    }

                    if (res.ok || (data && data.status === 'SUCCESS') || targetUrl.includes('/homepage.html')) {
                        if (data && data.token) {
                            localStorage.setItem('jwtToken', data.token);
                        }
                        window.location.href = (data && data.redirect) ? data.redirect : '/homepage.html';
                        return;
                    }
                } catch (err) {
                    console.warn('Login attempt failed for ' + url + ':', err);
                    lastErrorMessage = err.message || lastErrorMessage;
                }
            }

            errDiv.innerText = 'Unable to connect to server: ' + lastErrorMessage;
            errDiv.style.display = 'block';
        });
    </script>
</body>

</html>
