<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container {
            text-align: center;
        }
        .app-logo {
            font-size: 38px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .app-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
        form {
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="app-logo">&#10024; ChatApp</div>
        <p class="app-subtitle">Create your account</p>

        <form action="/siginpage" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="user_name" autocomplete="username" placeholder="Choose a username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="user_email" autocomplete="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="passowrd" autocomplete="new-password" placeholder="Create a password" required>

            <label for="confirmpass">Confirm Password</label>
            <input type="password" id="confirmpass" name="current_password" autocomplete="new-password" placeholder="Confirm your password" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="error" id="errorMessage"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Sign in</a>
        </div>
    </div>

    <script>
        // Check if user is already logged in
        fetch('/api/current-user')
            .then(res => {
                if (res.ok) return res.json();
                throw new Error('Not authenticated');
            })
            .then(userMap => {
                if (userMap.email) {
                    window.location.href = '/homepage.html';
                }
            })
            .catch(err => {
                console.log('Not logged in:', err.message);
            });

        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        if (error) {
            const errDiv = document.getElementById("errorMessage");
            errDiv.innerText = error;
            errDiv.style.display = 'block';
        }

        const getBackendUrl = () => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                if (window.location.port !== '8080' && window.location.port !== '') {
                    return 'http://localhost:8080';
                }
                return '';
            }
            return 'https://chat-backend-vjax.onrender.com';
        };

        // Handle Signup Form via fetch to prevent 404 redirect issues
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmpass = document.getElementById('confirmpass').value;
            const errDiv = document.getElementById("errorMessage");
            errDiv.style.display = 'none';
            errDiv.innerText = '';
            
            if (password !== confirmpass) {
                errDiv.innerText = "Passwords do not match";
                errDiv.style.display = 'block';
                return;
            }

            const formData = new FormData(this);
            let urlsToTry = ['/siginpage', 'https://chat-backend-vjax.onrender.com/siginpage'];
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                urlsToTry = ['http://localhost:8080/siginpage', '/siginpage'];
            }

            let lastErrorMessage = 'Failed to connect to backend server. Please try again.';
            for (let url of urlsToTry) {
                try {
                    let res = await fetch(url, {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });

                    const targetUrl = res.url || '';
                    if (targetUrl.includes('error=')) {
                        try {
                            const urlObj = new URL(targetUrl);
                            const errorMsg = urlObj.searchParams.get("error");
                            if (errorMsg) {
                                errDiv.innerText = decodeURIComponent(errorMsg.replace(/\+/g, ' '));
                                errDiv.style.display = 'block';
                                return;
                            }
                        } catch (err) {}
                    }

                    const contentType = res.headers.get("content-type");
                    let data = null;
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        data = await res.json();
                    }

                    if (data && data.status === 'ERROR') {
                        errDiv.innerText = data.message || 'Registration failed';
                        errDiv.style.display = 'block';
                        return;
                    }

                    if (res.ok || (data && data.status === 'SUCCESS') || targetUrl.includes('/login.html')) {
                        let msg = (data && data.message) ? data.message : 'Account created successfully! Please sign in.';
                        window.location.href = '/login.html?success=' + encodeURIComponent(msg);
                        return;
                    }
                } catch (err) {
                    console.warn('Attempt failed for ' + url + ':', err);
                    lastErrorMessage = err.message || lastErrorMessage;
                }
            }

            errDiv.innerText = 'Network Error: ' + lastErrorMessage;
            errDiv.style.display = 'block';
        });
    </script>
</body>

</html>
